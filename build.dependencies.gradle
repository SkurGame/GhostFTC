repositories {
    mavenCentral()
    google() // Needed for androidx
    maven { url = 'https://maven.brott.dev/' }
    maven { url 'https://jitpack.io' }
    maven { url = "https://mymaven.bylazar.com/releases" }
}

dependencies {
    implementation 'com.github.FTCPhantom16950:PhantomLib:1.1.1'
    implementation 'org.firstinspires.ftc:Inspection:11.0.0'
    implementation 'org.firstinspires.ftc:Blocks:11.0.0'
    //noinspection Aligned16KB
    implementation 'org.firstinspires.ftc:RobotCore:11.0.0'
    implementation 'org.firstinspires.ftc:RobotServer:11.0.0'
    implementation 'org.firstinspires.ftc:OnBotJava:11.0.0'
    implementation 'org.firstinspires.ftc:Hardware:11.0.0'
    implementation 'org.firstinspires.ftc:FtcCommon:11.0.0'
    implementation 'org.firstinspires.ftc:Vision:11.0.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'org.tensorflow:tensorflow-lite:2.17.0'
    implementation 'com.pedropathing:ftc:2.0.4'
    implementation 'com.pedropathing:telemetry:1.0.0'
    implementation "com.bylazar:fullpanels:1.0.12"
    implementation "com.bylazar:docs:1.0.5"
    implementation "com.bylazar:battery:1.0.3"
    implementation "com.bylazar:camerastream:1.0.0"
    implementation "com.bylazar:capture:1.0.3"
    implementation "com.bylazar:configurables:1.0.5"
    implementation "com.bylazar:field:1.0.6"
    implementation "com.bylazar:gamepad:1.0.4"
    implementation "com.bylazar:graph:1.0.4"
    implementation "com.bylazar:lights:1.0.3"
    implementation "com.bylazar:limelightproxy:1.0.4"
    implementation "com.bylazar:opmodecontrol:1.0.3"
    implementation "com.bylazar:pinger:1.0.3"
    implementation "com.bylazar:telemetry:1.0.5"
    implementation "com.bylazar:themes:1.0.3"
    implementation "com.bylazar:utils:1.0.4"
}

